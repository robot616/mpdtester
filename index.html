<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة فحص وبلايليست قنوات MPD / M3U8</title>
    
    <!-- مكتبة JW Player -->
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
    
    <!-- مكتبات Shaka Player والـ UI الخاص به -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/controls.min.css">

    <style>
        body {
            margin: 0; padding: 0; background: #0f0f0f; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .header {
            background: #181818; padding: 15px; border-bottom: 2px solid #1dcf60;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 22px; color: #1dcf60; }
        
        .controls-container {
            padding: 20px; background: #222; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center;
        }
        .auto-extract-box { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 10px; }
        .auto-extract-box textarea {
            width: 100%; height: 120px; padding: 12px; background: #1a2a20; border: 1px dashed #1dcf60; color: #fff;
            border-radius: 6px; font-size: 14px; outline: none; resize: vertical; box-sizing: border-box;
        }
        .auto-extract-box textarea::placeholder { color: #88c79c; }

        .extract-action-btn {
            padding: 12px; background: #0084ff; color: #fff; border: none; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 15px;
        }
        .extract-action-btn:hover { background: #006bd6; }
        
        .manual-inputs {
            display: flex; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 1000px; align-items: center;
        }
        input[type="text"], select {
            padding: 12px; background: #111; border: 1px solid #444; color: #fff;
            border-radius: 6px; font-size: 14px; outline: none; flex: 1; min-width: 180px;
        }
        input[type="text"]:focus, select:focus { border-color: #1dcf60; }
        
        .buttons-group {
            display: flex; gap: 10px; width: 100%; max-width: 1000px;
        }
        button.play-btn {
            padding: 12px 25px; background: #1dcf60; color: #000; border: none; flex: 3;
            border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.play-btn:hover { background: #17a84e; }
        button.clear-btn {
            padding: 12px 25px; background: #ff4d4d; color: #fff; border: none; flex: 1;
            border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.clear-btn:hover { background: #cc0000; }

        /* حاوية العرض الرئيسية (المشغل + قائمة البلايليست الجانبية) */
        .main-content {
            display: flex; flex-direction: row; gap: 20px; width: 95%; max-width: 1000px;
            margin: 20px auto; align-items: flex-start;
        }

        .player-wrapper {
            flex: 3; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); position: relative; min-width: 0;
        }
        
        #video-container { width: 100%; height: 100%; }

        /* صندوق البلايليست المستخرجة */
        .playlist-box {
            flex: 1.2; background: #181818; border: 1px solid #333; border-radius: 8px;
            max-height: 400px; overflow-y: auto; padding: 10px; box-sizing: border-box;
        }
        .playlist-box h3 { margin: 0 0 10px 0; font-size: 14px; color: #1dcf60; border-bottom: 1px solid #333; padding-bottom: 5px; text-align: center; }
        .playlist-item {
            padding: 8px 10px; background: #222; margin-bottom: 6px; border-radius: 4px;
            cursor: pointer; font-size: 13px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .playlist-item:hover { background: #2a2a2a; border-right: 3px solid #1dcf60; }
        .playlist-item.active { background: #1a3a24; border-right: 3px solid #1dcf60; color: #88c79c; font-weight: bold; }

        /* التعديلات البصرية لأيقونات JW Player */
        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=');
            background-size: 55%; background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzdjNhMiAyIDAgMCAxLTIgMkgzbTE4IDBoLTNhMiAyIDAgMCAxLTUtMlYzbTAgMTh2LTNhMiAyIDAgMCAxIDItMmgzTTMgMTZoM2EyIDIgMCAwIDEgMiAydjMiLz48L3N2Zz4=');
        }
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .player-wrapper, .playlist-box { width: 100%; flex: none; }
            .manual-inputs, .buttons-group { flex-direction: column; }
            input[type="text"], select, button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>أداة فحص وتشغيل بلايليست القنوات الذكية ⚡</h1>
    </div>

    <div class="controls-container">
        <div class="auto-extract-box">
            <textarea id="autoInput" placeholder="الصق محتوى الملف بالكامل هنا (يحتوي على قنوات متعددة وروابط وشفرات) ثم اضغط زر الاستخراج..."></textarea>
            <button class="extract-action-btn" onclick="extractPlaylist()">استخراج وفصل القنوات تلقائياً 🔄</button>
        </div>

        <div class="manual-inputs">
            <input type="text" id="streamUrl" placeholder="رابط القناة (URL)">
            <input type="text" id="keyId" placeholder="Key ID (k1)">
            <input type="text" id="keyVal" placeholder="Key (k2)">
            <select id="playerType">
                <option value="jw">JW Player (المفضل)</option>
                <option value="shaka">Shaka Player</option>
            </select>
        </div>

        <div class="buttons-group">
            <button class="play-btn" onclick="testStream()">تشغيل القناة المحددة ▶</button>
            <button class="clear-btn" onclick="clearAll()">مسح الكل 🗑️</button>
        </div>
    </div>

    <div class="main-content">
        <div class="player-wrapper">
            <div id="video-container"></div>
        </div>
        <div class="playlist-box" id="playlistContainer">
            <h3>قائمة القنوات المستخرجة (0)</h3>
            <div style="color: #777; text-align: center; font-size: 12px; margin-top: 20px;">لم يتم استخراج قنوات بعد</div>
        </div>
    </div>

    <script>
        let currentShakaPlayer = null;
        let extractedChannels = [];

        function extractPlaylist() {
            const rawText = document.getElementById('autoInput').value;
            if (!rawText.trim()) {
                alert("يرجى لصق النص أو الملف أولاً!");
                return;
            }

            extractedChannels = [];
            const lines = rawText.split(/\r?\n/);
            
            let pendingName = "";
            let pendingK1 = "";
            let pendingK2 = "";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                // 1. استخراج الاسم
                if (line.toUpperCase().startsWith('#EXTINF')) {
                    let commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) {
                        pendingName = line.substring(commaIdx + 1).trim();
                    }
                }

                // 2. استخراج المفاتيح
                let keyMatch = line.match(/([a-fA-F0-9]{32})[:=]([a-fA-F0-9]{32})/);
                if (keyMatch) {
                    pendingK1 = keyMatch[1];
                    pendingK2 = keyMatch[2];
                }

                // 3. استخراج الرابط (مع تجاهل الروابط اللي جوة وسوم الصور والـ XML)
                let cleanLine = line.replace(/="[^"]+"/g, ''); // يشيل أي حاجة بين علامتين تنصيص زي اللوجوهات
                let urlMatch = cleanLine.match(/https?:\/\/[^\s|<]+/);
                
                if (urlMatch) {
                    let url = urlMatch[0];
                    // استبعاد روابط الجايد والصور
                    if (!url.endsWith('.xml') && !url.endsWith('.png') && !url.endsWith('.jpg')) {
                        
                        // تطبيق القاعدة: لو الرابط m3u8 بنمسح الشفرة وناخد الرابط والاسم بس
                        if (url.includes('.m3u8') || url.includes('.ts')) {
                            pendingK1 = "";
                            pendingK2 = "";
                        }

                        extractedChannels.push({
                            name: pendingName || `قناة ${extractedChannels.length + 1}`,
                            url: url,
                            k1: pendingK1,
                            k2: pendingK2
                        });
                        
                        // تصفير الذاكرة للقناة اللي بعدها عشان البيانات متدخلش في بعض
                        pendingName = "";
                        pendingK1 = "";
                        pendingK2 = "";
                    }
                }
            }

            renderPlaylistUI();
        }

        function renderPlaylistUI() {
            const container = document.getElementById('playlistContainer');
            if (extractedChannels.length === 0) {
                container.innerHTML = `<h3>قائمة القنوات المستخرجة (0)</h3><div style="color: #ff4d4d; text-align: center; font-size: 12px; margin-top: 20px;">لم يتم العثور على روابط صالحة!</div>`;
                return;
            }

            let html = `<h3>قائمة القنوات المستخرجة (${extractedChannels.length})</h3>`;
            extractedChannels.forEach((ch, idx) => {
                html += `<div class="playlist-item" onclick="selectChannel(${idx})" id="ch-item-${idx}" title="${ch.name}">${idx + 1}. ${ch.name}</div>`;
            });
            container.innerHTML = html;

            // تشغيل أول قناة تلقائياً بعد الاستخراج
            if (extractedChannels.length > 0) {
                selectChannel(0);
            }
        }

        function selectChannel(idx) {
            const ch = extractedChannels[idx];
            document.getElementById('streamUrl').value = ch.url;
            document.getElementById('keyId').value = ch.k1;
            document.getElementById('keyVal').value = ch.k2;

            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                if(i === idx) el.classList.add('active');
                else el.classList.remove('active');
            });

            testStream();
        }

        function clearAll() {
            document.getElementById('autoInput').value = '';
            document.getElementById('streamUrl').value = '';
            document.getElementById('keyId').value = '';
            document.getElementById('keyVal').value = '';
            extractedChannels = [];
            document.getElementById('playlistContainer').innerHTML = `<h3>قائمة القنوات المستخرجة (0)</h3><div style="color: #777; text-align: center; font-size: 12px; margin-top: 20px;">تم التطهير بنجاح</div>`;
            
            const container = document.getElementById('video-container');
            container.innerHTML = '';
            if (currentShakaPlayer) {
                currentShakaPlayer.destroy();
                currentShakaPlayer = null;
            }
        }

        function testStream() {
            const url = document.getElementById('streamUrl').value.trim();
            const k1 = document.getElementById('keyId').value.trim();
            const k2 = document.getElementById('keyVal').value.trim();
            const playerType = document.getElementById('playerType').value;
            const container = document.getElementById('video-container');

            if (!url) {
                alert("يرجى إدخال أو اختيار رابط قناة صالح أولاً!");
                return;
            }

            container.innerHTML = '';
            if (currentShakaPlayer) {
                currentShakaPlayer.destroy();
                currentShakaPlayer = null;
            }

            if (playerType === 'jw') {
                container.innerHTML = '<div id="jw-player"></div>';
                
                let setupConfig = {
                    file: url,
                    type: url.indexOf('.m3u8') !== -1 || url.indexOf('.ts') !== -1 ? 'hls' : 'dash',
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    stretching: "uniform"
                };

                if (k1 && k2) {
                    setupConfig.drm = {
                        clearkey: { keyId: k1, key: k2 }
                    };
                }

                const playerInstance = jwplayer("jw-player").setup(setupConfig);

                playerInstance.on('ready', function() {
                    let isStretched = false;
                    const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

                    playerInstance.addButton(
                        diagonalCutArrow, 
                        "توسيع/تضييق الصورة", 
                        function() {
                            if (!isStretched) {
                                playerInstance.setConfig({ stretching: "exactfit" }); 
                                isStretched = true;
                            } else {
                                playerInstance.setConfig({ stretching: "uniform" });
                                isStretched = false;
                            }
                        },
                        "stretch-button"
                    );
                });

            } else if (playerType === 'shaka') {
                container.innerHTML = `
                    <div id="shaka-ui-container" dir="ltr" style="width: 100%; height: 100%; position: relative;">
                        <video id="shaka-video" style="width: 100%; height: 100%;" autoplay></video>
                    </div>
                `;
                
                const videoElement = document.getElementById('shaka-video');
                const shakaContainer = document.getElementById('shaka-ui-container');
                
                currentShakaPlayer = new shaka.Player(videoElement);
                const ui = new shaka.ui.Overlay(currentShakaPlayer, shakaContainer, videoElement);

                if (k1 && k2) {
                    currentShakaPlayer.configure({
                        drm: {
                            clearKeys: {
                                [k1]: k2
                            }
                        }
                    });
                }

                currentShakaPlayer.load(url).catch(function(error) {
                    console.error('Error loading video', error);
                    alert("حدث خطأ أثناء تحميل البث، تأكد من صحة الرابط ومفاتيح فك التشفير.");
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            shaka.polyfill.installAll();
        });
    </script>
</body>
</html>
