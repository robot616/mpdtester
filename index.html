<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة فحص قنوات MPD</title>
    
    <!-- مكتبة JW Player -->
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
    
    <!-- مكتبات Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/controls.min.css">

    <style>
        /* إخفاء شريط التمرير وضبط الأبعاد لتملأ الشاشة بالضبط */
        body {
            margin: 0; padding: 0; background: #0f0f0f; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        /* تقليل مساحة الرأس */
        .header {
            background: #181818; padding: 10px; border-bottom: 2px solid #1dcf60;
            text-align: center; flex-shrink: 0;
        }
        .header h1 { margin: 0; font-size: 20px; color: #1dcf60; }
        
        /* ضغط شريط التحكم عشان نسيب مساحة أكبر للبلاير */
        .controls-container {
            padding: 15px; background: #222; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; flex-shrink: 0;
        }
        .auto-extract-box { width: 100%; max-width: 1000px; display: flex; gap: 10px; }
        .auto-extract-box input {
            flex: 1; padding: 10px; background: #1a2a20; border: 1px dashed #1dcf60; color: #fff;
            border-radius: 6px; font-size: 14px; outline: none;
        }
        .auto-extract-box input::placeholder { color: #88c79c; }
        
        .manual-inputs {
            display: flex; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 1000px;
        }
        input[type="text"], select {
            padding: 10px; background: #111; border: 1px solid #444; color: #fff;
            border-radius: 6px; font-size: 14px; outline: none; flex: 1; min-width: 180px;
        }
        input[type="text"]:focus, select:focus { border-color: #1dcf60; }
        
        .buttons-group {
            display: flex; gap: 10px; width: 100%; max-width: 1000px;
        }
        button.play-btn {
            padding: 10px 25px; background: #1dcf60; color: #000; border: none; flex: 3;
            border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.play-btn:hover { background: #17a84e; }
        button.clear-btn {
            padding: 10px 25px; background: #ff4d4d; color: #fff; border: none; flex: 1;
            border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.clear-btn:hover { background: #cc0000; }

        /* جعل البلاير يأخذ المساحة المتبقية بالكامل */
        .player-wrapper {
            flex: 1; /* يأخذ باقي طول الشاشة (100vh) */
            position: relative; background: #000; width: 100%;
        }
        #video-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .shaka-video { width: 100%; height: 100%; }
        
        /* --------------------------------------------------- */
        /* التعديلات البصرية لأيقونات JW Player */
        /* --------------------------------------------------- */
        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=');
            background-size: 55%; background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzdjNhMiAyIDAgMCAxLTIgMkgzbTE4IDBoLTNhMiAyIDAgMCAxLTUtMlYzbTAgMTh2LTNhMiAyIDAgMCAxIDItMmgzTTMgMTZoM2EyIDIgMCAwIDEgMiAydjMiLz48L3N2Zz4=');
        }
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }

        @media (max-width: 768px) {
            .manual-inputs, .buttons-group { flex-direction: column; }
            input[type="text"], select, button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>أداة فحص وتجربة القنوات المشفّرة</h1>
    </div>

    <div class="controls-container">
        <!-- قسم الاستخراج التلقائي -->
        <div class="auto-extract-box">
            <input type="text" id="autoInput" placeholder="الصق الرابط مع الشفرة هنا لأي قناة (الاستخراج تلقائي) ⚡" oninput="extractData()">
        </div>

        <!-- الإدخال اليدوي أو ما بعد الاستخراج -->
        <div class="manual-inputs">
            <input type="text" id="streamUrl" placeholder="رابط القناة (URL)">
            <input type="text" id="keyId" placeholder="Key ID (k1)">
            <input type="text" id="keyVal" placeholder="Key (k2)">
            <select id="playerType">
                <option value="jw">JW Player (المفضل)</option>
                <option value="shaka">Shaka Player</option>
            </select>
        </div>

        <div class="buttons-group">
            <button class="play-btn" onclick="testStream()">تشغيل القناة ▶</button>
            <button class="clear-btn" onclick="clearAll()">مسح الكل 🗑️</button>
        </div>
    </div>

    <div class="player-wrapper">
        <div id="video-container">
            <!-- المشغل هيتحط هنا -->
        </div>
    </div>

    <script>
        let currentShakaPlayer = null;

        // دالة الاستخراج التلقائي
        function extractData() {
            const rawText = document.getElementById('autoInput').value.trim();
            if (!rawText) return;

            // استخراج الرابط
            const urlMatch = rawText.match(/https?:\/\/[^\s!|"'<>]+/);
            if (urlMatch) {
                document.getElementById('streamUrl').value = urlMatch[0];
            }

            // استخراج المفاتيح
            const keyMatch = rawText.match(/([a-fA-F0-9]{32})\s*:\s*([a-fA-F0-9]{32})/);
            if (keyMatch) {
                document.getElementById('keyId').value = keyMatch[1];
                document.getElementById('keyVal').value = keyMatch[2];
            }
        }

        // مسح الخانات
        function clearAll() {
            document.getElementById('autoInput').value = '';
            document.getElementById('streamUrl').value = '';
            document.getElementById('keyId').value = '';
            document.getElementById('keyVal').value = '';
            
            const container = document.getElementById('video-container');
            container.innerHTML = '';
            if (currentShakaPlayer) {
                currentShakaPlayer.destroy();
                currentShakaPlayer = null;
            }
        }

        function testStream() {
            const url = document.getElementById('streamUrl').value.trim();
            const k1 = document.getElementById('keyId').value.trim();
            const k2 = document.getElementById('keyVal').value.trim();
            const playerType = document.getElementById('playerType').value;
            const container = document.getElementById('video-container');

            if (!url) {
                alert("يرجى إدخال رابط القناة أولاً!");
                return;
            }

            // تنظيف أي مشغل سابق
            container.innerHTML = '';
            if (currentShakaPlayer) {
                currentShakaPlayer.destroy();
                currentShakaPlayer = null;
            }

            if (playerType === 'jw') {
                container.innerHTML = '<div id="jw-player"></div>';
                
                let setupConfig = {
                    file: url,
                    type: url.indexOf('.m3u8') !== -1 || url.indexOf('.ts') !== -1 ? 'hls' : 'dash',
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    stretching: "uniform"
                };

                if (k1 && k2) {
                    setupConfig.drm = {
                        clearkey: { keyId: k1, key: k2 }
                    };
                }

                const playerInstance = jwplayer("jw-player").setup(setupConfig);

                playerInstance.on('ready', function() {
                    let isStretched = false;
                    const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

                    playerInstance.addButton(
                        diagonalCutArrow, 
                        "توسيع/تضييق الصورة", 
                        function() {
                            if (!isStretched) {
                                playerInstance.setConfig({ stretching: "exactfit" }); 
                                isStretched = true;
                            } else {
                                playerInstance.setConfig({ stretching: "uniform" });
                                isStretched = false;
                            }
                        },
                        "stretch-button"
                    );
                });

            } else if (playerType === 'shaka') {
                container.innerHTML = '<video id="shaka-video" class="shaka-video" controls autoplay></video>';
                const videoElement = document.getElementById('shaka-video');
                
                currentShakaPlayer = new shaka.Player(videoElement);
                const ui = new shaka.ui.Overlay(currentShakaPlayer, container, videoElement);

                if (k1 && k2) {
                    currentShakaPlayer.configure({
                        drm: {
                            clearKeys: {
                                [k1]: k2
                            }
                        }
                    });
                }

                currentShakaPlayer.load(url).catch(function(error) {
                    console.error('Error loading video', error);
                    alert("حدث خطأ أثناء تحميل القناة، تأكد من الرابط والمفاتيح.");
                });
            }
        }

        // تثبيت شاكا بلاير
        document.addEventListener('DOMContentLoaded', () => {
            shaka.polyfill.installAll();
        });
    </script>

</body>
</html>
