<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة فحص وبلايليست قنوات MPD / M3U8</title>
    
    <!-- مكتبة JW Player -->
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
    
    <!-- مكتبات Shaka Player والـ UI الخاص به -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/controls.min.css">

    <style>
        body {
            margin: 0; padding: 0; background: #0f0f0f; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .header {
            background: #181818; padding: 15px; border-bottom: 2px solid #1dcf60;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 22px; color: #1dcf60; }
        
        .controls-container {
            padding: 20px; background: #222; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center;
        }
        .auto-extract-box { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 10px; }
        .auto-extract-box textarea {
            width: 100%; height: 120px; padding: 12px; background: #1a2a20; border: 1px dashed #1dcf60; color: #fff;
            border-radius: 6px; font-size: 14px; outline: none; resize: vertical; box-sizing: border-box;
        }
        .auto-extract-box textarea::placeholder { color: #88c79c; }

        .extract-action-btn {
            padding: 12px; background: #0084ff; color: #fff; border: none; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 15px;
        }
        .extract-action-btn:hover { background: #006bd6; }
        
        .manual-inputs {
            display: flex; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 1000px; align-items: center;
        }
        input[type="text"], select {
            padding: 12px; background: #111; border: 1px solid #444; color: #fff;
            border-radius: 6px; font-size: 14px; outline: none; flex: 1; min-width: 180px;
        }
        input[type="text"]:focus, select:focus { border-color: #1dcf60; }
        
        /* -------- شريط الأزرار والعدادات -------- */
        .action-row {
            display: flex; gap: 10px; width: 100%; max-width: 1000px;
            align-items: center; flex-wrap: wrap; justify-content: space-between;
        }
        
        .buttons-group {
            display: flex; gap: 10px; flex: 1; min-width: 250px;
        }
        button.play-btn {
            padding: 12px 25px; background: #1dcf60; color: #000; border: none; flex: 3;
            border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.play-btn:hover { background: #17a84e; }
        button.clear-btn {
            padding: 12px 25px; background: #ff4d4d; color: #fff; border: none; flex: 1;
            border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.clear-btn:hover { background: #cc0000; }

        .counters-container {
            display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0;
        }
        .counter-badge {
            background: #222; border: 1px solid #333; padding: 6px 10px; 
            border-radius: 6px; font-size: 11px; font-weight: bold; 
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; opacity: 0.5; transition: all 0.2s;
        }
        .counter-badge:hover { opacity: 0.8; }
        .counter-badge.active { opacity: 1; transform: scale(1.05); border-width: 2px; }
        
        .counter-badge span.count {
            padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #fff;
        }
        .counter-all { border-color: #1dcf60; color: #1dcf60; }
        .counter-all span.count { background: #1dcf60; color: #000; }

        .counter-mpd { border-color: #e74c3c; color: #e74c3c; }
        .counter-mpd span.count { background: #e74c3c; }

        .counter-m3u8 { border-color: #3498db; color: #3498db; }
        .counter-m3u8 span.count { background: #3498db; }

        .counter-ts { border-color: #f1c40f; color: #f1c40f; }
        .counter-ts span.count { background: #f1c40f; color: #000; }
        /* ------------------------------------- */

        .main-content {
            display: flex; flex-direction: row; gap: 20px; width: 95%; max-width: 1000px;
            margin: 20px auto; align-items: flex-start;
        }

        .player-wrapper {
            flex: 3; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); position: relative; min-width: 0;
        }
        
        #video-container { width: 100%; height: 100%; }

        .playlist-box {
            flex: 1.2; background: #181818; border: 1px solid #333; border-radius: 8px;
            max-height: 450px; overflow-y: auto; padding: 10px; box-sizing: border-box;
        }
        .playlist-box h3 { margin: 0 0 10px 0; font-size: 14px; color: #1dcf60; border-bottom: 1px solid #333; padding-bottom: 10px; text-align: center; }
        
        .playlist-item {
            padding: 10px; background: #222; margin-bottom: 6px; border-radius: 4px;
            cursor: pointer; font-size: 13px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .playlist-item:hover { background: #2a2a2a; border-right: 3px solid #1dcf60; }
        .playlist-item.active { background: #1a3a24; border-right: 3px solid #1dcf60; color: #88c79c; font-weight: bold; }

        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=');
            background-size: 55%; background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzdjNhMiAyIDAgMCAxLTIgMkgzbTE4IDBoLTNhMiAyIDAgMCAxLTItMlYzbTAgMThoM2EyIDIgMCAwIDEgMiAydjMiLz48L3N2Zz4=');
        }
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .player-wrapper, .playlist-box { width: 100%; flex: none; }
            .manual-inputs { flex-direction: column; }
            input[type="text"], select, button { width: 100%; }
            .buttons-group { width: 100%; flex-direction: row; }
            .counters-container { width: 100%; justify-content: center; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>أداة فحص وتشغيل بلايليست القنوات الذكية ⚡</h1>
    </div>

    <div class="controls-container">
        <div class="auto-extract-box">
            <textarea id="autoInput" placeholder="الصق محتوى الملف بالكامل هنا..."></textarea>
            <button class="extract-action-btn" onclick="extractPlaylist()">استخراج وفصل القنوات تلقائياً 🔄</button>
        </div>

        <div class="manual-inputs">
            <input type="text" id="streamUrl" placeholder="رابط القناة (URL)">
            <input type="text" id="keyId" placeholder="Key ID (k1)">
            <input type="text" id="keyVal" placeholder="Key (k2)">
            <select id="playerType">
                <option value="jw">JW Player (المفضل)</option>
                <option value="shaka">Shaka Player</option>
            </select>
        </div>

        <div class="action-row">
            <div class="buttons-group">
                <button class="play-btn" onclick="testStream()">تشغيل القناة المحددة ▶</button>
                <button class="clear-btn" onclick="clearAll()">مسح الكل 🗑️</button>
            </div>
            <div class="counters-container">
                <div id="badge-all" class="counter-badge counter-all active" onclick="filterByFormat('all')">الكل <span class="count" id="count-all">0</span></div>
                <div id="badge-mpd" class="counter-badge counter-mpd" onclick="filterByFormat('mpd')">MPD <span class="count" id="count-mpd">0</span></div>
                <div id="badge-m3u8" class="counter-badge counter-m3u8" onclick="filterByFormat('m3u8')">M3U8 <span class="count" id="count-m3u8">0</span></div>
                <div id="badge-ts" class="counter-badge counter-ts" onclick="filterByFormat('ts')">TS <span class="count" id="count-ts">0</span></div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="player-wrapper">
            <div id="video-container"></div>
        </div>
        <div class="playlist-box" id="playlistContainer">
            <h3>قائمة القنوات المستخرجة (0)</h3>
            <div style="color: #777; text-align: center; font-size: 12px; margin-top: 20px;">لم يتم استخراج قنوات بعد</div>
        </div>
    </div>

    <script>
        let currentShakaPlayer = null;
        let extractedChannels = [];
        let currentFilter = 'all';

        function filterByFormat(format) {
            currentFilter = format;
            
            document.querySelectorAll('.counter-badge').forEach(b => b.classList.remove('active'));
            document.getElementById('badge-' + format).classList.add('active');
            
            renderPlaylistUI();
        }

        function extractPlaylist() {
            const rawText = document.getElementById('autoInput').value;
            if (!rawText.trim()) {
                alert("يرجى لصق النص أو الملف أولاً!");
                return;
            }

            extractedChannels = [];
            const lines = rawText.split(/\r?\n/);
            
            let pendingName = "";
            let pendingUrls = [];
            let pendingK1 = "";
            let pendingK2 = "";
            let pendingAllKeys = {}; 

            function saveCurrentBlock() {
                if (pendingUrls.length > 0) {
                    pendingUrls.forEach((url, index) => {
                        let urlLower = url.toLowerCase();
                        let isM3u8 = urlLower.includes('.m3u8') || urlLower.includes('.ts') || urlLower.includes('.m3u');
                        
                        let finalK1 = isM3u8 ? "" : pendingK1;
                        let finalK2 = isM3u8 ? "" : pendingK2;
                        let finalAllKeys = isM3u8 ? {} : {...pendingAllKeys};
                        
                        let displayName = pendingName || `قناة مستخرجة ${extractedChannels.length + 1}`;
                        if (pendingUrls.length > 1) {
                            displayName += ` (رابط ${index + 1})`;
                        }

                        extractedChannels.push({
                            name: displayName,
                            url: url,
                            k1: finalK1,
                            k2: finalK2,
                            allKeys: finalAllKeys
                        });
                    });
                    
                    pendingName = "";
                    pendingUrls = [];
                    pendingK1 = "";
                    pendingK2 = "";
                    pendingAllKeys = {};
                }
            }

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let isExtInf = line.toUpperCase().startsWith('#EXTINF');
                let titleMatch = line.match(/"?(?:title|name)"?\s*:\s*["']([^"']+)["']/i);
                
                let keyRegex = /([a-fA-F0-9]{32})["']?\s*[:=]\s*["']?([a-fA-F0-9]{32})/g;
                let match;
                let foundKeyInLine = false;
                
                while ((match = keyRegex.exec(line)) !== null) {
                    pendingAllKeys[match[1]] = match[2];
                    foundKeyInLine = true;
                }

                let keyIdMatch = line.match(/"?(?:keyId|kid|k1)"?\s*:\s*["']?([a-fA-F0-9]{32})["']?/i);
                let keyValMatch = line.match(/"?(?:key|k2)"?\s*:\s*["']?([a-fA-F0-9]{32})["']?/i);
                
                if (keyIdMatch && keyValMatch && !foundKeyInLine) {
                    pendingAllKeys[keyIdMatch[1]] = keyValMatch[1];
                    foundKeyInLine = true;
                }

                let hasNewName = isExtInf || titleMatch;

                if (pendingUrls.length > 0) {
                    if (hasNewName) {
                        saveCurrentBlock();
                    } else if (foundKeyInLine && pendingK1) {
                        saveCurrentBlock();
                    }
                }

                if (isExtInf) {
                    let commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) {
                        pendingName = line.substring(commaIdx + 1).trim();
                    }
                } else if (titleMatch) {
                    pendingName = titleMatch[1];
                }

                if (foundKeyInLine && !pendingK1) {
                    let firstKid = Object.keys(pendingAllKeys)[0];
                    pendingK1 = firstKid;
                    pendingK2 = pendingAllKeys[firstKid];
                }

                let cleanLine = line.replace(/="[^"]+"/g, ''); 
                let urlMatch = cleanLine.match(/https?:\/\/[^\s|<"']+/);
                
                if (urlMatch) {
                    let url = urlMatch[0];
                    let urlLower = url.toLowerCase();
                    if (urlLower.includes('.mpd') || urlLower.includes('.m3u8') || urlLower.includes('.ts') || urlLower.includes('.m3u')) {
                        if (!pendingUrls.includes(url)) {
                            pendingUrls.push(url);
                        }
                    }
                }
            }
            
            saveCurrentBlock();

            if (extractedChannels.length === 0) {
                const globalUrls = rawText.match(/https?:\/\/[^\s|<"']+/g);
                const globalKeys = rawText.match(/\b([a-fA-F0-9]{32})\b/g);
                if (globalUrls) {
                    let keyIndex = 0;
                    globalUrls.forEach((u) => {
                        let urlLower = u.toLowerCase();
                        if (urlLower.includes('.mpd') || urlLower.includes('.m3u8') || urlLower.includes('.ts') || urlLower.includes('.m3u')) {
                            let isM3u8Fallback = urlLower.includes('.m3u8') || urlLower.includes('.ts') || urlLower.includes('.m3u');
                            let k1 = isM3u8Fallback ? "" : (globalKeys && globalKeys[keyIndex] ? globalKeys[keyIndex] : '');
                            let k2 = isM3u8Fallback ? "" : (globalKeys && globalKeys[keyIndex + 1] ? globalKeys[keyIndex + 1] : '');
                            
                            let fallbackAllKeys = {};
                            if (k1 && k2) fallbackAllKeys[k1] = k2;

                            extractedChannels.push({
                                name: `قناة مستخرجة ${extractedChannels.length + 1}`,
                                url: u,
                                k1: k1,
                                k2: k2,
                                allKeys: fallbackAllKeys
                            });
                            if(!isM3u8Fallback && globalKeys) keyIndex += 2;
                        }
                    });
                }
            }

            filterByFormat('all');
            
            if (extractedChannels.length > 0) {
                selectChannel(0);
            }
        }

        function renderPlaylistUI() {
            const container = document.getElementById('playlistContainer');
            
            let mpdCount = 0, m3u8Count = 0, tsCount = 0;
            
            extractedChannels.forEach(ch => {
                let urlLower = ch.url.toLowerCase();
                if (urlLower.includes('.mpd')) mpdCount++;
                else if (urlLower.includes('.m3u8') || urlLower.includes('.m3u')) m3u8Count++;
                else if (urlLower.includes('.ts')) tsCount++;
            });

            document.getElementById('count-all').innerText = extractedChannels.length;
            document.getElementById('count-mpd').innerText = mpdCount;
            document.getElementById('count-m3u8').innerText = m3u8Count;
            document.getElementById('count-ts').innerText = tsCount;

            let displayedChannels = extractedChannels.filter(ch => {
                if (currentFilter === 'all') return true;
                let urlLower = ch.url.toLowerCase();
                if (currentFilter === 'mpd') return urlLower.includes('.mpd');
                if (currentFilter === 'm3u8') return (urlLower.includes('.m3u8') || urlLower.includes('.m3u'));
                if (currentFilter === 'ts') return urlLower.includes('.ts');
                return true;
            });

            let html = `<h3>قائمة القنوات المستخرجة (${extractedChannels.length > 0 ? displayedChannels.length : 0})</h3>`;

            if (extractedChannels.length === 0) {
                html += `<div style="color: #ff4d4d; text-align: center; font-size: 12px; margin-top: 20px;">لم يتم العثور على روابط بث صالحة!</div>`;
            } else if (displayedChannels.length === 0) {
                html += `<div style="color: #777; text-align: center; font-size: 12px; margin-top: 20px;">لا توجد قنوات بهذه الصيغة</div>`;
            } else {
                displayedChannels.forEach((ch) => {
                    let originalIndex = extractedChannels.indexOf(ch);
                    html += `<div class="playlist-item" onclick="selectChannel(${originalIndex})" id="ch-item-${originalIndex}" title="${ch.name}">${originalIndex + 1}. ${ch.name}</div>`;
                });
            }

            container.innerHTML = html;
        }

        function selectChannel(idx) {
            const ch = extractedChannels[idx];
            document.getElementById('streamUrl').value = ch.url;
            document.getElementById('keyId').value = ch.k1;
            document.getElementById('keyVal').value = ch.k2;

            document.querySelectorAll('.playlist-item').forEach((el) => {
                if(el.id === `ch-item-${idx}`) el.classList.add('active');
                else el.classList.remove('active');
            });

            testStream();
        }

        function clearAll() {
            document.getElementById('autoInput').value = '';
            document.getElementById('streamUrl').value = '';
            document.getElementById('keyId').value = '';
            document.getElementById('keyVal').value = '';
            
            extractedChannels = [];
            filterByFormat('all'); 
            
            document.getElementById('playlistContainer').innerHTML = `<h3>قائمة القنوات المستخرجة (0)</h3>
            <div style="color: #777; text-align: center; font-size: 12px; margin-top: 20px;">تم التطهير بنجاح</div>`;
            
            const container = document.getElementById('video-container');
            container.innerHTML = '';
            if (currentShakaPlayer) {
                currentShakaPlayer.destroy();
                currentShakaPlayer = null;
            }
        }

        function testStream() {
            const url = document.getElementById('streamUrl').value.trim();
            const k1 = document.getElementById('keyId').value.trim();
            const k2 = document.getElementById('keyVal').value.trim();
            const playerType = document.getElementById('playerType').value;
            const container = document.getElementById('video-container');

            if (!url) {
                alert("يرجى إدخال أو اختيار رابط قناة صالح أولاً!");
                return;
            }

            container.innerHTML = '';
            if (currentShakaPlayer) {
                currentShakaPlayer.destroy();
                currentShakaPlayer = null;
            }

            let currentCh = extractedChannels.find(c => c.url === url && c.k1 === k1);
            let finalShakaKeys = {};
            
            if (currentCh && Object.keys(currentCh.allKeys).length > 0) {
                finalShakaKeys = currentCh.allKeys;
            } else if (k1 && k2) {
                finalShakaKeys[k1] = k2;
            }

            if (playerType === 'jw') {
                container.innerHTML = '<div id="jw-player"></div>';
                
                let setupConfig = {
                    file: url,
                    type: url.indexOf('.m3u8') !== -1 || url.indexOf('.ts') !== -1 ? 'hls' : 'dash',
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    stretching: "uniform"
                };

                if (k1 && k2) {
                    setupConfig.drm = {
                        clearkey: { keyId: k1, key: k2 }
                    };
                }

                const playerInstance = jwplayer("jw-player").setup(setupConfig);

                playerInstance.on('ready', function() {
                    let isStretched = false;
                    const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

                    playerInstance.addButton(
                        diagonalCutArrow, 
                        "توسيع/تضييق الصورة", 
                        function() {
                            if (!isStretched) {
                                playerInstance.setConfig({ stretching: "exactfit" }); 
                                isStretched = true;
                            } else {
                                playerInstance.setConfig({ stretching: "uniform" });
                                isStretched = false;
                            }
                        },
                        "stretch-button"
                    );
                });

            } else if (playerType === 'shaka') {
                container.innerHTML = `
                    <div id="shaka-ui-container" dir="ltr" style="width: 100%; height: 100%; position: relative;">
                        <video id="shaka-video" style="width: 100%; height: 100%;" autoplay></video>
                    </div>
                `;
                
                const videoElement = document.getElementById('shaka-video');
                const shakaContainer = document.getElementById('shaka-ui-container');
                
                currentShakaPlayer = new shaka.Player(videoElement);
                const ui = new shaka.ui.Overlay(currentShakaPlayer, shakaContainer, videoElement);

                if (Object.keys(finalShakaKeys).length > 0) {
                    currentShakaPlayer.configure({
                        drm: {
                            clearKeys: finalShakaKeys
                        }
                    });
                }

                currentShakaPlayer.load(url).catch(function(error) {
                    console.error('Error loading video', error);
                    alert("حدث خطأ أثناء تحميل البث، تأكد من صحة الرابط ومفاتيح فك التشفير.");
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            shaka.polyfill.installAll();
        });
    </script>
</body>
</html>
